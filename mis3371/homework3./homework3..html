<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Homework 3</title>
  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>
</head>
<body>
  <div class="page-container">
    <header class="top-header">
      <div>
        <h1>We'R'Docs Medical</h1>
        <p class="subtitle">Patient Registration Form - Homework 3</p>
      </div>
      <p id="todayDate"></p>
    </header>

    <main class="main-layout">
      <section class="form-section">
        <h2>Set Up a New Account</h2>

        <form id="registrationForm" action="thankyou.html">
          <div class="form-row">
            <label for="fname">First Name:</label>
            <div class="input-wrap">
              <input
                type="text"
                id="fname"
                name="fname"
                pattern="[A-Za-z'-]{1,30}"
                title="1 to 30 characters. Letters, apostrophes, and dashes only."
                required
              >
              <div class="field-error" id="fnameError"></div>
            </div>
          </div>

          <div class="form-row">
            <label for="mi">Middle Initial:</label>
            <div class="input-wrap">
              <input
                type="text"
                id="mi"
                name="mi"
                pattern="[A-Za-z]{1}"
                title="Single letter only. Leave blank if none."
              >
              <div class="field-error" id="miError"></div>
            </div>
          </div>

          <div class="form-row">
            <label for="lname">Last Name:</label>
            <div class="input-wrap">
              <input
                type="text"
                id="lname"
                name="lname"
                pattern="[A-Za-z'-]{1,30}"
                title="1 to 30 characters. Letters, apostrophes, and dashes only."
                required
              >
              <div class="field-error" id="lnameError"></div>
            </div>
          </div>

          <div class="form-row">
            <label for="dob">Date of Birth:</label>
            <div class="input-wrap">
              <input
                type="date"
                id="dob"
                name="dob"
                title="Birth date cannot be in the future or more than 120 years ago."
                required
              >
              <div class="field-error" id="dobError"></div>
            </div>
          </div>

          <div class="form-row">
            <label for="idnum">ID Number:</label>
            <div class="input-wrap">
              <input
                type="password"
                id="idnum"
                name="idnum"
                pattern="\d{9}"
                minlength="9"
                maxlength="9"
                title="Enter exactly 9 digits. This field is obscured."
                required
              >
              <div class="field-error" id="idnumError"></div>
            </div>
          </div>

          <div class="form-row">
            <label for="email">Email:</label>
            <div class="input-wrap">
              <input
                type="email"
                id="email"
                name="email"
                pattern="[a-zA-Z0-9._%+-]+@[a-zA-Z0-9.-]+\.[A-Za-z]{2,}"
                title="Enter a valid email in the format name@domain.tld"
                required
              >
              <div class="field-error" id="emailError"></div>
            </div>
          </div>

          <div class="form-row">
            <label for="phone">Phone:</label>
            <div class="input-wrap">
              <input
                type="text"
                id="phone"
                name="phone"
                pattern="\d{3}-\d{3}-\d{4}"
                placeholder="123-456-7890"
                title="Enter phone number in this format: 123-456-7890"
                required
              >
              <div class="field-error" id="phoneError"></div>
            </div>
          </div>

          <div class="form-row">
            <label for="addr1">Address Line 1:</label>
            <div class="input-wrap">
              <input
                type="text"
                id="addr1"
                name="addr1"
                minlength="2"
                maxlength="30"
                title="Required. Enter 2 to 30 characters."
                required
              >
              <div class="field-error" id="addr1Error"></div>
            </div>
          </div>

          <div class="form-row">
            <label for="addr2">Address Line 2:</label>
            <div class="input-wrap">
              <input
                type="text"
                id="addr2"
                name="addr2"
                minlength="2"
                maxlength="30"
                title="Optional. If entered, use 2 to 30 characters."
              >
              <div class="field-error" id="addr2Error"></div>
            </div>
          </div>

          <div class="form-row">
            <label for="city">City:</label>
            <div class="input-wrap">
              <input
                type="text"
                id="city"
                name="city"
                minlength="2"
                maxlength="30"
                title="Required. Enter 2 to 30 characters."
                required
              >
              <div class="field-error" id="cityError"></div>
            </div>
          </div>

          <div class="form-row">
            <label for="state">State:</label>
            <div class="input-wrap">
              <select id="state" name="state" title="Select a state" required>
                <option value="">Select State</option>
                <option value="AL">AL</option>
                <option value="AK">AK</option>
                <option value="AZ">AZ</option>
                <option value="AR">AR</option>
                <option value="CA">CA</option>
                <option value="CO">CO</option>
                <option value="CT">CT</option>
                <option value="DE">DE</option>
                <option value="FL">FL</option>
                <option value="GA">GA</option>
                <option value="HI">HI</option>
                <option value="ID">ID</option>
                <option value="IL">IL</option>
                <option value="IN">IN</option>
                <option value="IA">IA</option>
                <option value="KS">KS</option>
                <option value="KY">KY</option>
                <option value="LA">LA</option>
                <option value="ME">ME</option>
                <option value="MD">MD</option>
                <option value="MA">MA</option>
                <option value="MI">MI</option>
                <option value="MN">MN</option>
                <option value="MS">MS</option>
                <option value="MO">MO</option>
                <option value="MT">MT</option>
                <option value="NE">NE</option>
                <option value="NV">NV</option>
                <option value="NH">NH</option>
                <option value="NJ">NJ</option>
                <option value="NM">NM</option>
                <option value="NY">NY</option>
                <option value="NC">NC</option>
                <option value="ND">ND</option>
                <option value="OH">OH</option>
                <option value="OK">OK</option>
                <option value="OR">OR</option>
                <option value="PA">PA</option>
                <option value="RI">RI</option>
                <option value="SC">SC</option>
                <option value="SD">SD</option>
                <option value="TN">TN</option>
                <option value="TX">TX</option>
                <option value="UT">UT</option>
                <option value="VT">VT</option>
                <option value="VA">VA</option>
                <option value="WA">WA</option>
                <option value="WV">WV</option>
                <option value="WI">WI</option>
                <option value="WY">WY</option>
                <option value="DC">DC</option>
                <option value="PR">PR</option>
              </select>
              <div class="field-error" id="stateError"></div>
            </div>
          </div>

          <div class="form-row">
            <label for="zip">Zip Code:</label>
            <div class="input-wrap">
              <input
                type="text"
                id="zip"
                name="zip"
                pattern="\d{5}"
                placeholder="77002"
                title="Enter exactly 5 digits"
                required
              >
              <div class="field-error" id="zipError"></div>
            </div>
          </div>

          <fieldset class="choice-group">
            <legend>Check all conditions that apply:</legend>
            <label><input type="checkbox" name="conditions" value="Chicken Pox"> Chicken Pox</label>
            <label><input type="checkbox" name="conditions" value="Measles"> Measles</label>
            <label><input type="checkbox" name="conditions" value="Mumps"> Mumps</label>
            <label><input type="checkbox" name="conditions" value="Covid-19"> Covid-19</label>
            <label><input type="checkbox" name="conditions" value="Diabetes"> Diabetes</label>
            <div class="field-error group-error" id="conditionsError"></div>
          </fieldset>

          <fieldset class="choice-group">
            <legend>Vaccinated?</legend>
            <label><input type="radio" name="vaccinated" value="Yes" required> Yes</label>
            <label><input type="radio" name="vaccinated" value="No"> No</label>
            <label><input type="radio" name="vaccinated" value="Unsure"> Unsure</label>
            <div class="field-error group-error" id="vaccinatedError"></div>
          </fieldset>

          <div class="form-row">
            <label for="painLevel">Level of Pain:</label>
            <div class="input-wrap">
              <div class="slider-wrap">
                <input
                  type="range"
                  id="painLevel"
                  name="painLevel"
                  min="1"
                  max="10"
                  step="1"
                  value="10"
                  title="Slide to choose a level of pain from 1 to 10."
                >
                <div class="pain-scale">1 to 10</div>
                <span id="painValue">10</span>
              </div>
              <div class="field-error" id="painLevelError"></div>
            </div>
          </div>

          <div class="form-row textarea-row">
            <label for="about">Describe Symptoms:</label>
            <div class="input-wrap">
              <textarea
                id="about"
                name="about"
                rows="4"
                title="Optional comments. Avoid quotation marks."
              ></textarea>
              <div class="field-error" id="aboutError"></div>
            </div>
          </div>

          <div class="form-row">
            <label for="userid">Desired User ID:</label>
            <div class="input-wrap">
              <input
                type="text"
                id="userid"
                name="userid"
                pattern="[A-Za-z][A-Za-z0-9_-]{4,19}"
                title="5 to 20 characters. Must start with a letter. No spaces. Letters, numbers, underscore, and dash only."
                required
              >
              <div class="field-error" id="useridError"></div>
            </div>
          </div>

          <div class="form-row">
            <label for="password">Password:</label>
            <div class="input-wrap">
              <input
                type="password"
                id="password"
                name="password"
                minlength="8"
                maxlength="30"
                pattern="(?=.*[a-z])(?=.*[A-Z])(?=.*\d).{8,30}"
                title="8 to 30 characters, with at least 1 uppercase letter, 1 lowercase letter, and 1 number."
                required
              >
              <div class="field-error" id="passwordError"></div>
            </div>
          </div>

          <div class="form-row">
            <label for="confirmPassword">Re-enter Password:</label>
            <div class="input-wrap">
              <input
                type="password"
                id="confirmPassword"
                name="confirmPassword"
                title="Re-enter the same password."
                required
              >
              <div class="field-error" id="confirmPasswordError"></div>
            </div>
          </div>

          <div class="button-row">
            <button type="button" id="validateBtn" onclick="validateAllFields()">Validate</button>
            <button type="submit" id="submitBtn" styles="display:none;">Submit</button>
            <button type="reset" id="resetBtn">Start Over</button>
          </div>
        </form>
      </section>

      <section class="review-section">
        <h2>Error / Review Area</h2>
        <div id="errorMessages"></div>

        <h3>Please Review This Information</h3>
        <table id="reviewTable">
          <tbody></tbody>
        </table>
      </section>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
