<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Homework 2 - Patient Registration</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="page-container">

    <header class="top-header">
      <div>
        <h1>We'R'Docs Medical</h1>
        <p class="subtitle">Patient Registration Form - Homework 2</p>
      </div>
      <p id="todayDate"></p>
    </header>

    <main class="main-layout">
      <section class="form-section">
        <h2>Set Up a New Account</h2>

        <form id="registrationForm">
          <div class="form-row">
            <label for="fname">First Name:</label>
            <input
              type="text"
              id="fname"
              name="fname"
              pattern="[A-Za-z'-]{1,30}"
              title="1 to 30 characters. Letters, apostrophes, and dashes only."
              required
            >
          </div>

          <div class="form-row">
            <label for="mi">Middle Initial:</label>
            <input
              type="text"
              id="mi"
              name="mi"
              pattern="[A-Za-z]{1}"
              title="Single letter only. Leave blank if none."
            >
          </div>

          <div class="form-row">
            <label for="lname">Last Name:</label>
            <input
              type="text"
              id="lname"
              name="lname"
              pattern="[A-Za-z2-5'-]{1,30}"
              title="1 to 30 characters. Letters, apostrophes, numbers 2 to 5, and dashes only."
              required
            >
          </div>

          <div class="form-row">
            <label for="dob">Date of Birth:</label>
            <input
              type="date"
              id="dob"
              name="dob"
              title="Birth date cannot be in the future or more than 120 years ago."
              required
            >
          </div>

          <div class="form-row">
            <label for="idnum">ID Number:</label>
            <input
              type="password"
              id="idnum"
              name="idnum"
              minlength="4"
              maxlength="20"
              title="Enter an ID number. This field is obscured."
              required
            >
          </div>

          <div class="form-row">
            <label for="email">Email:</label>
            <input
              type="email"
              id="email"
              name="email"
              pattern="[a-zA-Z0-9._%+-]+@[a-zA-Z0-9.-]+\.[A-Za-z]{2,}"
              title="Enter a valid email in the format name@domain.tld"
              required
            >
          </div>

          <div class="form-row">
            <label for="phone">Phone:</label>
            <input
              type="text"
              id="phone"
              name="phone"
              pattern="\d{3}-\d{3}-\d{4}"
              placeholder="123-456-7890"
              title="Enter phone number in this format: 123-456-7890"
              required
            >
          </div>

          <div class="form-row">
            <label for="addr1">Address Line 1:</label>
            <input
              type="text"
              id="addr1"
              name="addr1"
              minlength="2"
              maxlength="30"
              title="Required. Enter 2 to 30 characters."
              required
            >
          </div>

          <div class="form-row">
            <label for="addr2">Address Line 2:</label>
            <input
              type="text"
              id="addr2"
              name="addr2"
              minlength="2"
              maxlength="30"
              title="Optional. If entered, use 2 to 30 characters."
            >
          </div>

          <div class="form-row">
            <label for="city">City:</label>
            <input
              type="text"
              id="city"
              name="city"
              minlength="2"
              maxlength="30"
              title="Required. Enter 2 to 30 characters."
              required
            >
          </div>

          <div class="form-row">
            <label for="state">State:</label>
            <select id="state" name="state" title="Select a state" required>
              <option value="">Select State</option>
              <option value="AL">AL</option>
              <option value="AK">AK</option>
              <option value="AZ">AZ</option>
              <option value="AR">AR</option>
              <option value="CA">CA</option>
              <option value="CO">CO</option>
              <option value="CT">CT</option>
              <option value="DE">DE</option>
              <option value="FL">FL</option>
              <option value="GA">GA</option>
              <option value="HI">HI</option>
              <option value="ID">ID</option>
              <option value="IL">IL</option>
              <option value="IN">IN</option>
              <option value="IA">IA</option>
              <option value="KS">KS</option>
              <option value="KY">KY</option>
              <option value="LA">LA</option>
              <option value="ME">ME</option>
              <option value="MD">MD</option>
              <option value="MA">MA</option>
              <option value="MI">MI</option>
              <option value="MN">MN</option>
              <option value="MS">MS</option>
              <option value="MO">MO</option>
              <option value="MT">MT</option>
              <option value="NE">NE</option>
              <option value="NV">NV</option>
              <option value="NH">NH</option>
              <option value="NJ">NJ</option>
              <option value="NM">NM</option>
              <option value="NY">NY</option>
              <option value="NC">NC</option>
              <option value="ND">ND</option>
              <option value="OH">OH</option>
              <option value="OK">OK</option>
              <option value="OR">OR</option>
              <option value="PA">PA</option>
              <option value="RI">RI</option>
              <option value="SC">SC</option>
              <option value="SD">SD</option>
              <option value="TN">TN</option>
              <option value="TX">TX</option>
              <option value="UT">UT</option>
              <option value="VT">VT</option>
              <option value="VA">VA</option>
              <option value="WA">WA</option>
              <option value="WV">WV</option>
              <option value="WI">WI</option>
              <option value="WY">WY</option>
              <option value="DC">DC</option>
              <option value="PR">PR</option>
            </select>
          </div>

          <div class="form-row">
            <label for="zip">Zip Code:</label>
            <input
              type="text"
              id="zip"
              name="zip"
              pattern="\d{5}(-\d{4})?"
              placeholder="77002 or 77002-1234"
              title="Enter 5 digits or ZIP+4 format like 77002-1234"
              required
            >
          </div>

          <fieldset class="choice-group">
            <legend>Check all conditions that apply:</legend>
            <label><input type="checkbox" name="conditions" value="Chicken Pox"> Chicken Pox</label>
            <label><input type="checkbox" name="conditions" value="Measles"> Measles</label>
            <label><input type="checkbox" name="conditions" value="Mumps"> Mumps</label>
            <label><input type="checkbox" name="conditions" value="Covid-19"> Covid-19</label>
            <label><input type="checkbox" name="conditions" value="Diabetes"> Diabetes</label>
          </fieldset>

          <fieldset class="choice-group">
            <legend>Vaccinated?</legend>
            <label><input type="radio" name="vaccinated" value="Yes" required> Yes</label>
            <label><input type="radio" name="vaccinated" value="No"> No</label>
            <label><input type="radio" name="vaccinated" value="Unsure"> Unsure</label>
          </fieldset>

          <div class="form-row">
            <label for="budget">Home Budget:</label>
            <div class="slider-wrap">
              <input
                type="range"
                id="budget"
                name="budget"
                min="20000"
                max="200000"
                step="5000"
                value="110000"
                oninput="updateSlider()"
                title="Slide to choose a budget range."
              >
              <span id="budgetValue">$110,000</span>
            </div>
          </div>

          <div class="form-row textarea-row">
            <label for="about">Tell Us About Yourself:</label>
            <textarea
              id="about"
              name="about"
              rows="4"
              title="Optional comments. Avoid quotation marks."
            ></textarea>
          </div>

          <div class="form-row">
            <label for="userid">Desired User ID:</label>
            <input
              type="text"
              id="userid"
              name="userid"
              pattern="[A-Za-z][A-Za-z0-9_-]{4,29}"
              title="5 to 30 characters. Must start with a letter. No spaces. Letters, numbers, underscore, and dash only."
              required
            >
          </div>

          <div class="form-row">
            <label for="password">Password:</label>
            <input
              type="password"
              id="password"
              name="password"
              minlength="8"
              maxlength="30"
              pattern="(?=.*[a-z])(?=.*[A-Z])(?=.*\d)(?=.*[!@#%^&*()\-_=+\\/<>.,`~])[A-Za-z\d!@#%^&*()\-_=+\\/<>.,`~]{8,30}"
              title="8 to 30 characters, with at least 1 uppercase, 1 lowercase, 1 number, and 1 special character. No quotes."
              required
            >
          </div>

          <div class="form-row">
            <label for="confirmPassword">Re-enter Password:</label>
            <input
              type="password"
              id="confirmPassword"
              name="confirmPassword"
              title="Re-enter the same password."
              required
            >
          </div>

          <div class="button-row">
            <button type="button" onclick="reviewForm()">Review</button>
            <button type="submit">Submit</button>
            <button type="reset">Start Over</button>
          </div>
        </form>
      </section>

      <section class="review-section">
        <h2>Error / Review Area</h2>
        <div id="errorMessages"></div>

        <h3>Please Review This Information</h3>
        <table id="reviewTable">
          <tbody></tbody>
        </table>
      </section>
    </main>
  </div>

  <script src="script.js"></script>
</body>
</html>
